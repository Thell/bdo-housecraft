[package]
name = "housecraft"
version = "0.3.18"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
debug = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
clap-verbosity-flag = "3.0.3"
comfy-table = "8.0.0"
console = "0.16.4"
csv = "1.3.0"
env_logger = "0.11.11"
highs-sys = { version = "1.15.0", features = ["highs_release", "ninja"] }
indexmap = { version = "2.14.0", features = ["serde"] }
lazy_static = "1.5.0"
log = "0.4.33"
mimalloc = { version = "0.1.52", default-features = false }
num_cpus = "1.16.0"
once_cell = "1.20.2"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
stable-vec = "0.4.1"
